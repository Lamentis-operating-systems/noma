name: Verify Supabase deployment

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-account:
    name: Verify delete-account endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify authenticated endpoint is deployed
        run: ./scripts/verify-delete-account-deployment.sh
