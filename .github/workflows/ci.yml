name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS build, unit tests, and scheduled UI tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run unit tests
        if: github.event_name != 'schedule'
        timeout-minutes: 20
        run: >
          xcodebuild test
          -project Noma.xcodeproj
          -scheme Noma
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -only-testing:NomaTests
          -derivedDataPath "$RUNNER_TEMP/noma-derived-data"

      - name: Run UI tests
        if: github.event_name == 'schedule'
        timeout-minutes: 30
        run: >
          xcodebuild test
          -project Noma.xcodeproj
          -scheme Noma
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -only-testing:NomaUITests
          -derivedDataPath "$RUNNER_TEMP/noma-derived-data"
